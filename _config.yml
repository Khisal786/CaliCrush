title: "Your Brand / Project Name"
email: "your-email@domain.com"
description: "A short, keyword-rich meta description optimized for search engines and geo-targeted traffic."
url: "https://shahzad-est.com"
baseurl: "" # Keep empty if using a custom domain or root GitHub Pages repo

# Build settings
markdown: kramdown
# theme: minima # We can override this or build custom layouts from scratch

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# SEO & Geo-Targeting Defaults
author:
  name: "Khisal Iftikhar"
  email: "your-email@domain.com"

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

sass:
  style: compressed
  sass_dir: _sass

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle
  - vendor/cache